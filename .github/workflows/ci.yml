name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: node CLI/setup_script.js --version
      - run: node CLI/setup_script.js list-backends
      - run: node CLI/setup_script.js create test-project --backend Express --skip-git
      - run: |
          node CLI/setup_script.js create invalid/name --backend Flask 2>&1 || true
      - run: |
          node CLI/setup_script.js create test --skip-git 2>&1 || true

  test-backends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend:
          - { name: Flask, lang: python, setup: 'python3 -m pip install flask' }
          - { name: Express, lang: node, setup: '' }
          - { name: Koa, lang: node, setup: '' }
          - { name: Gin, lang: go, setup: '' }
          - { name: Echo, lang: go, setup: '' }
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install

      - name: Setup Python
        if: matrix.backend.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        if: matrix.backend.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install backend deps
        if: matrix.backend.setup != ''
        run: ${{ matrix.backend.setup }}

      - name: Scaffold and test ${{ matrix.backend.name }}
        run: |
          set -e
          NAME="ci-test-$(echo ${{ matrix.backend.name }} | tr '[:upper:] ' '[:lower:]-')"
          node CLI/setup_script.js create "$NAME" --backend "${{ matrix.backend.name }}" --skip-git
          if [ -d "$NAME" ]; then
            echo "Scaffold successful: $NAME"
          else
            echo "Scaffold failed: directory not found"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm audit --audit-level=high

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run coverage
